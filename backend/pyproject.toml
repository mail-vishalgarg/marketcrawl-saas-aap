[project]
name = "marketcrawl-saas"
version = "0.1.0"
description = "MarketCrawl SaaS backend — Amazon scraping API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=2.1.0",
    "PyJWT[crypto]>=2.9.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
