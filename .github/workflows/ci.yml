name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting (ruff)
        run: uv run ruff format --check app/

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Type check (pyright)
        run: uv run pyright app/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t marketcrawl-saas:ci .

      - name: Smoke test health endpoint
        run: |
          docker run -d --name app -p 8000:8000 marketcrawl-saas:ci
          echo "Waiting for server to be ready..."
          for i in $(seq 1 15); do
            curl --silent --fail http://localhost:8000/health && echo "Health check passed!" && break
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done
          curl --fail http://localhost:8000/health
          docker stop app

      - name: Show container logs on failure
        if: failure()
        run: docker logs app 2>&1 || true
